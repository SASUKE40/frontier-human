<!doctype html>
<!-- Source for site/og.png. Render at 1200x630: node tools/render-og.mjs -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #eef4ff; color: #0a1a3f;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
    border: 14px solid #0a1a3f;
    display: grid; grid-template-rows: auto 1fr;
  }
  .bar { display: flex; justify-content: space-between; border-bottom: 8px solid #0a1a3f; font-size: 34px; font-weight: 900; }
  .bar div { padding: 18px 28px; }
  .bar span { background: #1d3fd6; color: #fff; padding: 0 6px; }
  .bar .n { border-left: 8px solid #0a1a3f; font-family: ui-monospace, Menlo, monospace; }
  .main { display: grid; grid-template-columns: 1.15fr 1fr; }
  h1 { font-size: 112px; line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase; padding: 40px 32px; border-right: 8px solid #0a1a3f; }
  h1 mark { background: #1d3fd6; color: #fff; padding: 0 8px; }
  .chat { padding: 40px 32px; display: grid; align-content: center; }
  .turn { display: grid; grid-template-columns: 120px 1fr; border: 6px solid #0a1a3f; background: #f8fbff; box-shadow: 10px 10px 0 #0a1a3f; }
  .turn + .turn { margin-top: -6px; }
  .who { font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 800; padding: 16px; border-right: 6px solid #0a1a3f; letter-spacing: 0.08em; }
  .txt { padding: 16px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 700; line-height: 1.25; }
  .reply .who { background: #0a1a3f; color: #eef4ff; }
  .reply .txt { font-family: "Arial Black", Helvetica, Arial, sans-serif; font-weight: 900; font-size: 120px; line-height: 1; padding: 10px 18px 22px; }
</style>
</head>
<body>
  <div class="bar"><div>FRONTIER<span>HUMAN</span></div><div class="n">20 / EN · 中</div></div>
  <div class="main">
    <h1>What did they <mark>mean?</mark></h1>
    <div class="chat">
      <div class="turn"><div class="who">AGENT</div><div class="txt">Should I delete the old migration?</div></div>
      <div class="turn reply"><div class="who">HUMAN</div><div class="txt">or</div></div>
    </div>
  </div>
</body>
</html>
