<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrontierHuman</title>
  <meta name="description" content="An agent asks a clarifying question. The human answers &quot;or&quot;. What did they mean?" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("frontierhuman:theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23ea4a0f'/><text x='50%' y='58%' font-size='44' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='900' fill='black'>?</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" data-action="home">FRONTIER<span>HUMAN</span></a>
    <nav class="nav">
      <a href="https://github.com/SASUKE40/frontier-human/blob/main/research.md" target="_blank" rel="noopener">Research</a>
      <a href="https://github.com/SASUKE40/frontier-human" target="_blank" rel="noopener">GitHub</a>
      <button class="theme" id="theme" type="button" aria-label="Switch theme"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M11 2a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </nav>
  </header>

  <main id="app" aria-live="polite">
    <noscript><p>FrontierHuman needs JavaScript.</p></noscript>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
