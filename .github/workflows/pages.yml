name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate items
        run: |
          node -e '
            const d = require("./site/data/items.json");
            if (d.items.length !== 20) throw new Error("expected 20 items, got " + d.items.length);
            for (const it of d.items) {
              if (it.options.length !== 4) throw new Error(it.id + ": needs 4 options");
              if (!(it.correct >= 0 && it.correct < 4)) throw new Error(it.id + ": bad correct index");
              if (!(it.literal >= 0 && it.literal < 4)) throw new Error(it.id + ": bad literal index");
              if (!d.categories[it.category]) throw new Error(it.id + ": unknown category");
              if (!d.difficulties[it.difficulty]) throw new Error(it.id + ": unknown difficulty");
            }
            const z = require("./site/data/items.zh.json");
            if (z.version !== d.version) throw new Error("zh version mismatch");
            for (const k of Object.keys(d.categories)) if (!z.categories[k]) throw new Error("zh missing category " + k);
            for (const k of Object.keys(d.difficulties)) if (!z.difficulties[k]) throw new Error("zh missing difficulty " + k);
            for (const it of d.items) {
              const t = z.items[it.id];
              if (!t) throw new Error("zh missing " + it.id);
              for (const f of ["context", "question", "reply", "cue", "explanation"]) if (!t[f]) throw new Error("zh " + it.id + " missing " + f);
              if (t.options.length !== 4) throw new Error("zh " + it.id + ": needs 4 options");
              if (t.history.length !== it.history.length) throw new Error("zh " + it.id + ": history length");
            }
            console.log("items ok");
          '
      - name: Build share pages
        run: |
          node tools/build-pages.mjs
          node -e '
            const fs = require("fs");
            const n = require("./site/data/items.json").items.length;
            const need = ["covers/default-en.png", "covers/default-zh.png", "zh/index.html", "logo-light.svg", "logo-dark.svg", "favicon.svg", "favicon-32.png", "apple-touch-icon.png"];
            for (let s = 0; s <= n; s++) for (const l of ["en", "zh"]) need.push(`covers/${l}/${s}.png`, `s/${s}/${l === "zh" ? "zh/" : ""}index.html`);
            const missing = need.filter((f) => !fs.existsSync("site/" + f));
            if (missing.length) throw new Error("missing: " + missing.join(", "));
            console.log("assets ok:", need.length);
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
